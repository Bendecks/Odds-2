name: Manual Bet365 Odds Report

on:
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport slug for Odds-API.io'
        required: true
        default: 'football'
        type: string
      max_price_events:
        description: 'Max senior events from today to request odds for. Uses /odds/multi in batches of up to 10.'
        required: true
        default: '60'
        type: string
      max_pages:
        description: 'Max /events pages to scan for today only'
        required: true
        default: '4'
        type: string

jobs:
  build-bet365-report:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      BET365_REPORT_SPORT: ${{ inputs.sport }}
      BET365_REPORT_MAX_PRICE_EVENTS: ${{ inputs.max_price_events }}
      BET365_REPORT_MAX_PAGES: ${{ inputs.max_pages }}
      BET365_REPORT_MAX_EVENTS: '100'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab

      - name: Build today's Bet365 odds report
        run: |
          python scripts/build_bet365_today_odds_report.py \
            --sport "${{ inputs.sport }}" \
            --max-price-events "${{ inputs.max_price_events }}" \
            --max-pages "${{ inputs.max_pages }}"

      - name: Commit latest report files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/bet365/latest data/raw/odds_api_io/bet365_today_report
          git diff --cached --quiet || git commit -m "Update today's Bet365 odds report"
          git push

      - name: Upload Bet365 report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bet365-today-odds-report
          path: |
            output/bet365/latest/bet365_today_odds_report.html
            output/bet365/latest/bet365_today_odds_report.pdf
            output/bet365/latest/bet365_today_odds_report.md
            output/bet365/latest/bet365_today_events.csv
            output/bet365/latest/bet365_today_markets.csv
            output/bet365/latest/bet365_today_excluded_youth_reserve.csv
            output/bet365/latest/bet365_today_report_summary.json
            output/bet365/latest/bet365_today_rate_limit_headers.csv
