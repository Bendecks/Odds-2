name: Manual All-Day Market PDF

on:
  workflow_dispatch:
    inputs:
      sports:
        description: 'Comma-separated Odds-API sport slugs'
        required: true
        default: 'football,tennis,basketball,ice-hockey,american-football,baseball,cricket,rugby-union,rugby-league,handball,esports'
        type: string
      max_price_events_per_sport:
        description: 'Max whole-day events per sport to request markets for'
        required: true
        default: '200'
        type: string
      max_pages:
        description: 'Max /events pages per sport for whole-day coverage'
        required: true
        default: '10'
        type: string
      min_bookmaker_count:
        description: 'Fallback coverage filter for sports/leagues not on allowlist'
        required: true
        default: '10'
        type: string
  schedule:
    - cron: '0 */4 * * *'

jobs:
  build-all-day-market-pdf:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      BET365_ALL_DAY_SPORTS: ${{ inputs.sports || 'football,tennis,basketball,ice-hockey,american-football,baseball,cricket,rugby-union,rugby-league,handball,esports' }}
      BET365_ALL_DAY_MAX_PRICE_EVENTS_PER_SPORT: ${{ inputs.max_price_events_per_sport || '200' }}
      BET365_ALL_DAY_MAX_PAGES: ${{ inputs.max_pages || '10' }}
      BET365_ALL_DAY_MIN_BOOKMAKER_COUNT: ${{ inputs.min_bookmaker_count || '10' }}
      BET365_ALL_DAY_MAX_EVENTS: '100'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab

      - name: Build all-day market PDF
        run: |
          python scripts/build_bet365_today_multisport_all_day_pdf.py \
            --sports "${BET365_ALL_DAY_SPORTS}" \
            --max-price-events-per-sport "${BET365_ALL_DAY_MAX_PRICE_EVENTS_PER_SPORT}" \
            --max-pages "${BET365_ALL_DAY_MAX_PAGES}" \
            --min-bookmaker-count "${BET365_ALL_DAY_MIN_BOOKMAKER_COUNT}"

      - name: Commit all-day market PDF files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/bet365/latest/bet365_today_multisport_all_day_report.pdf
          git add output/bet365/latest/bet365_today_multisport_all_day_events.csv
          git add output/bet365/latest/bet365_today_multisport_all_day_markets.csv
          git add output/bet365/latest/bet365_today_multisport_all_day_excluded.csv
          git add output/bet365/latest/bet365_today_multisport_all_day_summary.json
          git add output/bet365/latest/bet365_today_multisport_all_day_rate_limit_headers.csv
          git add data/raw/odds_api_io/bet365_today_multisport_all_day_report
          if git diff --cached --quiet; then
            echo "No all-day PDF changes to commit"
          else
            git commit -m "Update all-day market PDF"
            git pull --rebase origin main
            git push
          fi

      - name: Upload all-day market PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-day-market-pdf
          path: |
            output/bet365/latest/bet365_today_multisport_all_day_report.pdf
            output/bet365/latest/bet365_today_multisport_all_day_events.csv
            output/bet365/latest/bet365_today_multisport_all_day_markets.csv
            output/bet365/latest/bet365_today_multisport_all_day_excluded.csv
            output/bet365/latest/bet365_today_multisport_all_day_summary.json
            output/bet365/latest/bet365_today_multisport_all_day_rate_limit_headers.csv

      - name: Email all-day market PDF
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: 'Bet365 all-day market PDF'
          to: ${{ secrets.REPORT_EMAIL_TO }}
          from: ${{ secrets.REPORT_EMAIL_FROM }}
          secure: false
          body: |
            Bet365 all-day market PDF is attached.

            Workflow: Manual All-Day Market PDF
            Repo: Bendecks/Odds-2
          attachments: output/bet365/latest/bet365_today_multisport_all_day_report.pdf
