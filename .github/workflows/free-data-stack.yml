name: Free Betting Data Stack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/free-data-stack.yml'
      - 'DEVLOG.md'
      - 'data/config/**'
  schedule:
    - cron: '0 */12 * * *'

jobs:
  build-model:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      ODDS_API_IO_MAX_CALLS: '10'
      ODDS_API_IO_MAX_EVENTS: '100'
      ODDS_API_IO_EVENTS_MAX_PAGES: '3'
      ODDS_API_IO_MAX_PRICE_EVENTS: '10'
      FORWARD_FIXTURE_MAX_PREDICTIONS: '80'
      FORWARD_FIXTURE_INCLUDE_BASELINE_UNMATCHED: 'true'
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_MAX_CALLS: '0'
      API_FOOTBALL_MAX_FIXTURES: '5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch football-data.co.uk data
        run: python scripts/fetch_football_data.py

      - name: Fetch upcoming fixtures
        run: python scripts/fetch_upcoming_fixtures.py

      - name: Build manual odds template
        run: python scripts/build_manual_odds_template.py

      - name: Build manual odds instructions
        run: python scripts/build_manual_odds_instructions.py

      - name: Fetch multi-league data
        run: python scripts/fetch_multileague_data.py

      - name: Fetch multi-season data
        run: python scripts/fetch_multiseason_data.py

      - name: Fetch ClubElo ratings
        run: python scripts/fetch_clubelo.py

      - name: Create market snapshot
        run: python scripts/create_market_snapshot.py

      - name: Build fair odds scaffold
        run: python scripts/build_fair_odds.py

      - name: Generate Poisson predictions
        run: python scripts/generate_poisson_predictions.py

      - name: Apply probability calibration
        run: python scripts/apply_probability_calibration.py

      - name: Build forward fixture predictions
        run: python scripts/build_forward_fixture_predictions.py

      - name: Fetch odds-api.io forward prices
        run: python scripts/fetch_odds_api_io_forward_prices.py

      - name: Build automatic forward source diagnostics
        run: python scripts/build_automatic_forward_source_report.py

      - name: Build manual forward snapshots
        run: python scripts/build_manual_forward_snapshots.py

      - name: Build forward input status
        run: python scripts/build_forward_input_status.py

      - name: Build probability calibration impact diagnostics
        run: python scripts/build_probability_calibration_impact_report.py

      - name: Calculate expected value
        run: python scripts/calculate_ev.py

      - name: Log predictions
        run: python scripts/log_predictions.py

      - name: Cleanup prediction archive
        run: python scripts/cleanup_prediction_log.py

      - name: Settle predictions
        run: python scripts/settle_predictions.py

      - name: Calculate CLV
        run: python scripts/calculate_clv.py

      - name: Build CLV band diagnostics
        run: python scripts/build_clv_band_report.py

      - name: Build sample phase performance diagnostics
        run: python scripts/build_phase_performance_report.py

      - name: Build league performance diagnostics
        run: python scripts/build_league_performance_report.py

      - name: Build signal suppression rules
        run: python scripts/build_signal_suppression_rules.py

      - name: Build rule action summary
        run: python scripts/build_rule_action_summary.py

      - name: Build candidate bets
        run: python scripts/build_candidate_bets.py

      - name: Build proxy candidate observations
        run: python scripts/build_proxy_candidate_observations.py

      - name: Build proxy candidate explanation report
        run: python scripts/build_proxy_candidate_explanation_report.py

      - name: Build forward price coverage report
        run: python scripts/build_forward_price_coverage_report.py

      - name: Build odds-api.io usage report
        run: python scripts/build_odds_api_io_usage_report.py

      - name: Build odds-api.io bookmaker diagnostics
        run: python scripts/build_odds_api_io_bookmaker_report.py

      - name: Build paper test picks
        run: python scripts/build_paper_test_picks.py

      - name: Build paper test log status
        run: python scripts/build_paper_test_log_status.py

      - name: Build edge quality diagnostics
        run: python scripts/build_edge_quality_report.py

      - name: Build daily betting card
        run: python scripts/build_daily_betting_card.py

      - name: Build performance analytics
        run: python scripts/build_performance_report.py

      - name: Build signal performance diagnostics
        run: python scripts/build_signal_performance_report.py

      - name: Build filter feedback diagnostics
        run: python scripts/build_filter_feedback_report.py

      - name: Build bankroll simulation diagnostics
        run: python scripts/build_bankroll_simulation_report.py

      - name: Build strategy risk diagnostics
        run: python scripts/build_strategy_risk_report.py

      - name: Build probability band diagnostics
        run: python scripts/build_probability_band_report.py

      - name: Build model adjustment recommendations
        run: python scripts/build_model_adjustment_recommendation.py

      - name: Build data leakage diagnostics
        run: python scripts/build_data_leakage_report.py

      - name: Build sample reliability diagnostics
        run: python scripts/build_sample_reliability_report.py

      - name: Build forward test readiness diagnostics
        run: python scripts/build_forward_test_readiness_report.py

      - name: Build daily decision diagnostics
        run: python scripts/build_daily_decision_report.py

      - name: Build project handoff diagnostics
        run: python scripts/build_project_handoff_report.py

      - name: Build model health diagnostics
        run: python scripts/build_model_health_report.py

      - name: Build probability calibration diagnostics
        run: python scripts/build_probability_calibration_report.py

      - name: Build probability distribution diagnostics
        run: python scripts/build_probability_distribution_report.py

      - name: Build market sanity diagnostics
        run: python scripts/build_market_sanity_report.py

      - name: Build market proxy quality diagnostics
        run: python scripts/build_market_proxy_quality_report.py

      - name: Build dataset quality diagnostics
        run: python scripts/build_dataset_quality_report.py

      - name: Build historical coverage diagnostics
        run: python scripts/build_historical_coverage_report.py

      - name: Build sample size diagnostics
        run: python scripts/build_sample_size_report.py

      - name: Build CLV trend diagnostics
        run: python scripts/build_clv_trend_report.py

      - name: Build system readiness diagnostics
        run: python scripts/build_system_readiness_report.py

      - name: Build calibration action plan
        run: python scripts/build_calibration_action_plan.py

      - name: Build snapshot timing diagnostics
        run: python scripts/build_snapshot_timing_report.py

      - name: Build prediction stability diagnostics
        run: python scripts/build_prediction_stability_report.py

      - name: Build market alignment diagnostics
        run: python scripts/build_market_alignment_report.py

      - name: Build consolidated project status report
        run: python scripts/build_project_status_report.py

      - name: Build operational decision report
        run: python scripts/build_operational_decision_report.py

      - name: Build automation monitor report
        run: python scripts/build_automation_monitor_report.py

      - name: Build human action report
        run: python scripts/build_human_action_report.py

      - name: Build Gemini AI review
        run: python scripts/build_gemini_ai_review.py

      - name: Validate free sources
        run: python scripts/validate_free_sources.py

      - name: Commit validation artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/latest output/history data/raw data/model data/predictions data/market_snapshots data/manual data/config
          git diff --cached --quiet || git commit -m "Auto-update workflow validation artifacts"
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betting-data-artifacts
          path: |
            data/raw/
            data/model/
            data/predictions/
            data/market_snapshots/
            data/manual/
            data/config/
            output/latest/
            output/history/
