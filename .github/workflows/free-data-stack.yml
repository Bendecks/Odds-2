name: Free Betting Data Stack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/free-data-stack.yml'
  schedule:
    - cron: '0 */12 * * *'

jobs:
  build-model:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch football-data.co.uk data
        run: python scripts/fetch_football_data.py

      - name: Fetch ClubElo ratings
        run: python scripts/fetch_clubelo.py

      - name: Build fair odds scaffold
        run: python scripts/build_fair_odds.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betting-data-artifacts
          path: |
            data/raw/
            data/model/
