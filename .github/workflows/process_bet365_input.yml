name: Process bet365 input

on:
  workflow_dispatch:
    inputs:
      force_research_candidate:
        description: 'Force one otherwise eligible market into research candidate selection'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      simulate_research_write_record:
        description: 'Write a fake research_record instead of calling Gemini research'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: process-bet365-input
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync latest main
        run: git pull --rebase --autostash origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf PyMuPDF openai requests

      - name: Run simplified Gemini paper-pick pipeline
        run: python scripts/gemini_simple_pipeline.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PDF_MODEL: gemini-2.5-flash
          GEMINI_DECISION_MODEL: gemini-2.5-flash
          ODDS_MAX_FILES: 5
          ODDS_TIMEZONE: Europe/Copenhagen
          SIMPLE_MAX_PICKS: 3
          SIMPLE_MIN_OVERROUND: 1.00
          SIMPLE_MAX_OVERROUND: 1.20

      - name: Commit simplified pipeline outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -A data/simple_picks_log.jsonl output/latest/simple_pipeline_output.json output/reports/simple_pipeline_report.md output/debug_text || true
          git diff --cached --quiet && exit 0
          git commit -m "Run simplified Gemini paper-pick pipeline"
          git push
