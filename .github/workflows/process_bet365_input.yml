name: Process bet365 input

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-bet365-input
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync latest main
        run: git pull --rebase --autostash origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf PyMuPDF

      - name: Run data integrity foundation
        run: python scripts/process_bet365_input.py
        env:
          ODDS_MAX_FILES: 25
          ODDS_TIMEZONE: Europe/Copenhagen

      - name: Commit data integrity outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -A data/team_alias_suggestions.json data/pick_tracker.jsonl output/latest output/reports output/debug_text || true
          git diff --cached --quiet && exit 0
          git commit -m "Process bet365 input"
          git push
